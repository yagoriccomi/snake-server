# =============================================================
#  Dependabot — atualização e alerta contínuos de dependências
#
#  Uma auditoria de segurança é uma foto do dia em que rodou. O que
#  mantém a foto atualizada é isto: um robô abrindo PR quando surge
#  versão nova ou CVE. [#62]
# =============================================================

version: 2

updates:
  # ── Dependências npm ──
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    # Com 5, o limite enchia e o robô retinha PRs em silêncio (express-rate-limit,
    # typescript e @vitest/coverage-v8 ficaram de fora em 21/09).
    open-pull-requests-limit: 10
    labels: ['dependencias']
    commit-message:
      # Mesmo padrão de Conventional Commits que o commitlint exige —
      # senão o PR do robô é barrado pelo próprio hook do projeto.
      prefix: 'build'
      prefix-development: 'chore'
      include: scope
    groups:
      # Majors que só funcionam em par: sozinhos quebram o npm ci (ERESOLVE) ou
      # deixam a configuração pela metade. Vêm antes do grupo semanal porque o
      # Dependabot põe cada pacote no primeiro grupo que casa.
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: ['major']
      eslint:
        patterns: ['eslint', '@eslint/js']
        update-types: ['major']
      # Agrupar as ferramentas de desenvolvimento evita cinco PRs por
      # semana para bumps de patch que ninguém revisa de verdade.
      ferramentas-de-desenvolvimento:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # Major de runtime muda comportamento: entra por decisão humana,
      # com leitura do changelog, não por PR automático.
      - dependency-name: 'express'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']
      - dependency-name: 'express-rate-limit'
        update-types: ['version-update:semver-major']
      # Os tipos acompanham o Node da imagem (Dockerfile e ci.yml), não o último
      # Node lançado: tipos mais novos aceitam APIs que o runtime não tem. O major
      # sobe à mão, junto com a imagem base.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # ── Actions do próprio pipeline ──
  # Uma action desatualizada é superfície de ataque de supply chain
  # tão real quanto uma dependência npm.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: ['ci']
    commit-message:
      prefix: 'ci'

  # ── Imagem base do Dockerfile ──
  # A base está fixada por digest de propósito; o Dependabot é quem
  # avisa quando esse digest ficou para trás em correção de segurança.
  # Só funciona com o `FROM` literal (ele não resolve `ARG`).
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: monthly
    labels: ['docker']
    commit-message:
      prefix: 'build'
    ignore:
      # O major do Node sobe à mão, junto com o ci.yml e o @types/node:
      # trocar só a imagem deixaria o CI e os tipos num Node diferente.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
