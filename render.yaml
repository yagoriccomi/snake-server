# =============================================================
#  Infraestrutura como código — Render [#78]
#  runtime: docker → a Render constrói a MESMA imagem que você
#  roda local, com o mesmo Dockerfile. Paridade real. [#79][#81]
#
#  As variáveis com `sync: false` NÃO ficam neste arquivo:
#  são cadastradas no painel da Render (as sensíveis como secret). [#37][#80]
# =============================================================

services:
  - type: web
    name: snakethai-api
    runtime: docker
    plan: free
    region: oregon

    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Constrói o último stage do Dockerfile (`runtime`) — o enxuto. [#85]

    # Endpoint trivial e sem I/O: acorda rápido depois da hibernação. [#82]
    healthCheckPath: /health

    # DESLIGADO de proposito. Com autoDeploy ligado, a Render publica a
    # cada push - inclusive de codigo que nao passou por lint, tipo, teste,
    # auditoria de licenca ou validacao da imagem. Existiriam dois caminhos
    # ate producao, e o mais rapido deles seria justamente o sem gate.
    #
    # Agora o deploy e disparado pelo job `deploy` do .github/workflows/ci.yml,
    # que so roda depois que todos os outros passam. [#49][#77]
    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # ── Base: identidade e autorização ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # ── CORS (só se houver cliente web; o app nativo dispensa) ──
      - key: ALLOWED_ORIGIN
        sync: false

      # ── Módulo: comprovantes ──
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    # ATENÇÃO: não acrescente SUPABASE_JWT_SECRET (permitiria forjar
    # tokens) nem SUPABASE_SERVICE_ROLE_KEY (ignora a RLS). O servidor
    # se recusa a subir se a primeira estiver presente.

  # ---------------------------------------------------------------------
  #  Worker de eliminação de mídia — LGPD art. 15, I e art. 18, VI.
  #
  #  Cron Job, não serviço web: não escuta porta, não recebe requisição de
  #  fora, não tem `/health`. É essa ausência de superfície HTTP que torna
  #  aceitável ele carregar a SUPABASE_SERVICE_ROLE_KEY — a chave que ignora
  #  a RLS por completo NUNCA vai para o serviço `snakethai-api` acima, mas
  #  aqui, isolada, sem endpoint algum exposto, é o módulo que o próprio
  #  docs/BACKEND.md §7 já previa precisar dela. [#55]
  #
  #  ESCOPO: consome o que o banco JÁ enfileirou (conta excluída, comprovante
  #  recusado, migração de provedor, prazo de guarda vencido, anexo removido)
  #  e, na mesma execução, apaga os anexos de justificativas/ e motivos/ que
  #  ficaram sem linha no banco há mais de 24 h (contrato § 13.3). Os prazos
  #  de guarda são decididos no banco; este job não inventa nenhum.
  # ---------------------------------------------------------------------
  - type: cron
    name: snakethai-media-cleanup
    runtime: docker
    # ⚠️ Cron Jobs na Render NÃO têm plano gratuito — o mais barato é
    # "starter" (pago). Diferente do serviço web acima, que é free.
    # Confirme o custo no painel antes do primeiro deploy deste serviço.
    plan: starter
    region: oregon

    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Diária, de madrugada: fora do horário de uso do app, e frequência
    # suficiente para a fila não crescer entre execuções.
    schedule: '0 3 * * *'
    dockerCommand: node dist/jobs/media-cleanup/media-cleanup.js

    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
